name: Docmost contract drift

on:
  pull_request:
    paths:
      - ".github/workflows/contract-drift.yml"
      - "scripts/check_docmost_contracts.py"
      - "src/docmost_cli/api/**"
      - "src/docmost_cli/models/**"
      - "tests/conftest.py"
      - "tests/contracts/**"
      - "tests/integration/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contract-drift.yml"
      - "scripts/check_docmost_contracts.py"
      - "src/docmost_cli/api/**"
      - "src/docmost_cli/models/**"
      - "tests/conftest.py"
      - "tests/contracts/**"
      - "tests/integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out docmost-cli
        uses: actions/checkout@v4

      - name: Read pinned Docmost ref
        id: contract
        shell: bash
        run: |
          echo "ref=$(python -c 'import json; print(json.load(open("tests/contracts/docmost-v0.95.0.json"))["docmost"]["ref"])')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Docmost contract sources
        uses: actions/checkout@v4
        with:
          repository: docmost/docmost
          ref: ${{ steps.contract.outputs.ref }}
          path: .docmost-upstream
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            apps/client/src/features/page/services/page-service.ts
            apps/client/src/features/search
            apps/server/src

      - name: Verify pinned Docmost checkout
        shell: bash
        run: |
          test "$(git -C .docmost-upstream rev-parse HEAD)" = "${{ steps.contract.outputs.ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check upstream contract
        run: python scripts/check_docmost_contracts.py --docmost-repo .docmost-upstream

      - name: Run contract and integration collection tests
        run: pytest tests/contracts tests/integration

      - name: Lint contract test layer
        run: ruff check scripts tests/contracts tests/integration

      - name: Check contract test formatting
        run: ruff format --check scripts tests/contracts tests/integration
